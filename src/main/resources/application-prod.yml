# 生产环境配置
spring:
  application:
    name: sapiece-gateway

  # R2DBC 数据库配置（生产环境）
  r2dbc:
    url: ${DB_URL:r2dbc:mysql://localhost:3306/blog_project}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    pool:
      initial-size: 20
      max-size: 100

  # Redis 配置（生产环境）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT 配置（生产环境从环境变量读取）
jwt:
  secret: ${JWT_SECRET:SAPiece-Gateway-Production-Secret-Key-2025}
  expiration: 604800000
  refresh: 259200000

# 限流配置（生产环境严格限制）
rate-limit:
  enabled: true
  qps: 10
  capacity: 20

# 日志配置（生产环境简化日志）
logging:
  level:
    root: WARN
    com.sapiece.nova.sapiecegateway: INFO
    org.springframework.r2dbc: WARN
    org.springframework.security: WARN

server:
  port: ${SERVER_PORT:8080}
