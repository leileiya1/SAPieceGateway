worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── 基础配置 ──────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;   # 隐藏 Nginx 版本号（安全加固）

    # ── 日志格式（含链路 traceId） ────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'trace="$http_x_trace_id" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── 限流（防 DDoS） ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── 上游：Gateway 实例池（docker-compose scale gateway=N 自动扩容） ───
    upstream gateway_backend {
        least_conn;   # 最少连接算法，适合响应时间不均匀的场景
        server gateway:8080;
        # docker-compose scale 后，DNS 轮询会自动发现新实例
        keepalive 32;
    }

    # ── HTTP 服务器（重定向到 HTTPS）─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # 健康检查端点不重定向（K8s ELB / 内网探活）
        location /actuator/health {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 其余全部重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 服务器 ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS 证书（生产环境替换为真实证书）
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLS 安全配置
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS（告知浏览器此域名只走 HTTPS）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 限流
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 100;

        # 代理到 Gateway 集群
        location / {
            proxy_pass         http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # 缓冲配置
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         4 64k;
        }
    }
}
