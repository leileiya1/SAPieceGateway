# SAPiece Gateway — 高可用生产部署
#
# 架构：
#   nginx (80/443) → gateway-1 (8080) ┐
#                  → gateway-2 (8081) ┘ → MySQL + Redis + Nacos
#
# 可观测性：Jaeger (链路追踪) + Prometheus (指标) + Grafana (看板)
#
# 启动：
#   docker-compose up -d
#
# 扩容到 3 个实例：
#   docker-compose up -d --scale gateway=3
#
# 停止：
#   docker-compose down

services:

  # ─── 网关实例（支持横向扩展） ───────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: sapiece-gateway:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 数据库（生产替换为真实地址）
      SPRING_R2DBC_URL: r2dbc:mysql://${DB_HOST:-10.70.239.17}:3306/product_test?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_R2DBC_USERNAME: ${DB_USER:-sapiece}
      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD:-159357}
      # Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-10.70.239.17}
      SPRING_DATA_REDIS_PORT: 6379
      # Nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: ${NACOS_HOST:-10.70.239.17}:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: ${NACOS_HOST:-10.70.239.17}:8848
      # JWT
      JWT_SECRET: ${JWT_SECRET:-SAPiece-Gateway-Secret-Key-2025-For-Authentication}
      # 下游签名
      GATEWAY_DOWNSTREAM_SECRET: ${GATEWAY_DOWNSTREAM_SECRET:-change-me-in-production}
      # OTel → Jaeger
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: sapiece-gateway
      # Sentinel Dashboard（如有）
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: ${SENTINEL_DASHBOARD:-}
    expose:
      - "8080"
    depends_on:
      jaeger:
        condition: service_started
    volumes:
      - gateway-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - gateway-net

  # ─── Nginx 反向代理 / 负载均衡 ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro          # 生产证书挂载点
      - nginx-logs:/var/log/nginx
    depends_on:
      - gateway
    networks:
      - gateway-net

  # ─── Jaeger 链路追踪 ───────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC（网关推送 trace）
      - "4318:4318"     # OTLP HTTP（可选）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - gateway-net

  # ─── Prometheus 指标采集 ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - gateway-net

  # ─── Grafana 可视化看板 ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  gateway-logs:
  nginx-logs:
  prometheus-data:
  grafana-data:
