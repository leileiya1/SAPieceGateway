apiVersion: apps/v1
kind: Deployment
metadata:
  name: sapiece-gateway
  namespace: sapiece
  labels:
    app: sapiece-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sapiece-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep full capacity during upgrades. The hard topology spread constraint
      # guarantees that the two steady-state replicas use different nodes.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sapiece-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sapiece-gateway
      containers:
        - name: gateway
          image: sapiece-gateway:native-k3s-v6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sapiece-gateway-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SPRING_R2DBC_URL
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: DB_URL}
            - name: SPRING_R2DBC_USERNAME
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: DB_USERNAME}
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: DB_PASSWORD}
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: REDIS_HOST}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: REDIS_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: JWT_SECRET}
            - name: GATEWAY_DOWNSTREAM_SECRET
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: GATEWAY_DOWNSTREAM_SECRET}
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: OAUTH_ENCRYPTION_KEY}
            - name: OAUTH_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: OAUTH_ALLOWED_HOSTS}
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: CORS_ALLOWED_ORIGINS}
            - name: SIGNATURE_SECRET
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: SIGNATURE_SECRET}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "768Mi"}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 18
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - {name: logs, mountPath: /app/logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
