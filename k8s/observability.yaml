apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sapiece-prometheus-discovery
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sapiece-prometheus-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sapiece-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: sapiece-k3s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: kubernetes-annotated-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
  gateway-alerts.yml: |
    groups:
      - name: sapiece-gateway
        rules:
          - alert: SAPieceTargetDown
            expr: up{namespace="sapiece"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "SAPiece target {{ $labels.pod }} is down"
          - alert: SAPieceGatewayHigh5xxRate
            expr: sum(rate(gateway_errors_total{error_code=~"5.."}[5m])) / clamp_min(sum(rate(gateway_requests_total[5m])), 1) > 0.02
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Gateway 5xx ratio is above 2%"
          - alert: SAPieceGrpcErrors
            expr: sum(rate(grpc_echo_requests_total{code!="OK"}[5m])) > 1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "gRPC error rate is elevated"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=48h
            - --storage.tsdb.retention.size=1500MB
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
