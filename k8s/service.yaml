apiVersion: v1
kind: Service
metadata:
  name: sapiece-gateway-service
  namespace: sapiece
  labels:
    app: sapiece-gateway
spec:
  type: ClusterIP       # 内部服务；外部流量通过 Ingress 或 LoadBalancer 进入
  selector:
    app: sapiece-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
---
# LoadBalancer Service（云环境直接暴露，或替换为 Ingress）
apiVersion: v1
kind: Service
metadata:
  name: sapiece-gateway-lb
  namespace: sapiece
  labels:
    app: sapiece-gateway
  annotations:
    # AWS: service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # 阿里云: service.beta.kubernetes.io/alicloud-loadbalancer-spec: "slb.s2.small"
spec:
  type: LoadBalancer
  selector:
    app: sapiece-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
