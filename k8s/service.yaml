apiVersion: v1
kind: Service
metadata:
  name: sapiece-gateway
  namespace: sapiece
  labels:
    app: sapiece-gateway
spec:
  type: ClusterIP
  selector:
    app: sapiece-gateway
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: sapiece-gateway-management
  namespace: sapiece
spec:
  type: ClusterIP
  selector:
    app: sapiece-gateway
  ports:
    - {name: management, port: 9091, targetPort: http}
---
# The existing external Nginx can target port 30096 on either K3s node.
apiVersion: v1
kind: Service
metadata:
  name: sapiece-gateway-nodeport
  namespace: sapiece
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: sapiece-gateway
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30096}
