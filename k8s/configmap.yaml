apiVersion: v1
kind: ConfigMap
metadata:
  name: sapiece-gateway-config
  namespace: sapiece
  labels:
    app: sapiece-gateway
data:
  # 非敏感启动配置；动态路由存 MySQL，实例端点由 Kubernetes Service 维护。
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_APPLICATION_NAME: "sapiece-gateway"
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8080"
  # GraalVM 25 cannot invoke the JDK MXBean CPU methods without reachability
  # metadata. Keep this binder disabled for the already deployed v4 image; the
  # checked-in metadata enables it again on the next immutable CI build.
  MANAGEMENT_METRICS_BINDERS_PROCESSOR_ENABLED: "false"
  MANAGEMENT_METRICS_ENABLE_PROCESS_CPU_USAGE: "false"
  MANAGEMENT_METRICS_ENABLE_PROCESS_CPU_TIME: "false"
  MANAGEMENT_METRICS_ENABLE_SYSTEM_CPU_USAGE: "false"
  KUBERNETES_DNS_DISCOVERY_ENABLED: "true"
  KUBERNETES_CLUSTER_DOMAIN: "cluster.local"
  KUBERNETES_SERVICE_DEFAULT_PORT: "80"
  SPRING_CLOUD_SENTINEL_ENABLED: "true"
  OTLP_METRICS_EXPORT_ENABLED: "false"
  TRACING_SAMPLING_PROBABILITY: "0.1"
  LOGGING_LEVEL_COM_SAPIECE_NOVA_SAPIECEGATEWAY: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC: "WARN"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "WARN"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "INFO"
  # 安装 OTLP Collector 后再启用导出。
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "sapiece-gateway"
