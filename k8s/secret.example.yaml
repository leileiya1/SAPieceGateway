# Example only. Copy to secret.yaml (gitignored), replace every placeholder,
# or create the same keys through your cluster's secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: sapiece-gateway-secret
  namespace: sapiece
type: Opaque
stringData:
  DB_URL: "r2dbc:mysql://mysql.sapiece.svc.cluster.local:3306/sapiece_gateway?useSSL=false&serverTimezone=Asia/Shanghai"
  DB_USERNAME: "gateway_native"
  DB_PASSWORD: "replace-me"
  MYSQL_ROOT_PASSWORD: "replace-with-an-independent-random-secret"
  REDIS_HOST: "redis.sapiece.svc.cluster.local"
  REDIS_PASSWORD: "replace-with-an-independent-random-secret"
  JWT_SECRET: "replace-with-a-random-256-bit-secret"
  GATEWAY_DOWNSTREAM_SECRET: "replace-with-an-independent-random-secret"
  OAUTH_ENCRYPTION_KEY: "replace-with-an-independent-base64-encoded-32-byte-key"
  OAUTH_ALLOWED_HOSTS: "github.com,githubusercontent.com,accounts.google.com,oauth2.googleapis.com,www.googleapis.com,gitee.com"
  CORS_ALLOWED_ORIGINS: "https://your-frontend.example.com"
  SIGNATURE_SECRET: "replace-with-an-independent-random-secret"
  SSL_KEY_STORE_PASSWORD: "replace-me"
