apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: sapiece
spec:
  podSelector:
    matchLabels: {app: sapiece-gateway}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9091}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grpc-transcoder-ingress
  namespace: sapiece
spec:
  podSelector:
    matchLabels: {app: grpc-transcoder}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: sapiece-gateway}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9901}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grpc-echo-ingress
  namespace: sapiece
spec:
  podSelector:
    matchLabels: {app: grpc-echo}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: grpc-transcoder}
      ports:
        - {protocol: TCP, port: 9090}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 8081}
