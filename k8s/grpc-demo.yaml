apiVersion: v1
kind: Service
metadata:
  name: grpc-echo-headless
  namespace: sapiece
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: {app: grpc-echo}
  ports:
    - {name: grpc, port: 9090, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-echo
  namespace: sapiece
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: grpc-echo}
  template:
    metadata:
      labels: {app: grpc-echo}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: grpc-echo}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: grpc-echo
          image: sapiece-grpc-echo:v4
          imagePullPolicy: Never
          ports:
            - {name: grpc, containerPort: 9090}
            - {name: operations, containerPort: 8081}
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: TERMINATION_DRAIN_DELAY, value: 4s}
            - {name: GATEWAY_HMAC_REQUIRED, value: "true"}
            - {name: GATEWAY_SIGNATURE_MAX_AGE, value: 30s}
            - {name: GRPC_MTLS_ENABLED, value: "true"}
            - name: GATEWAY_DOWNSTREAM_SECRET
              valueFrom:
                secretKeyRef: {name: sapiece-gateway-secret, key: GATEWAY_DOWNSTREAM_SECRET}
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          startupProbe:
            httpGet: {path: /live, port: operations}
            failureThreshold: 20
            periodSeconds: 1
          readinessProbe:
            httpGet: {path: /ready, port: operations}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: operations}
            periodSeconds: 10
          volumeMounts:
            - {name: grpc-tls, mountPath: /etc/grpc-tls, readOnly: true}
      volumes:
        - name: grpc-tls
          secret:
            secretName: grpc-echo-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-transcoder
  namespace: sapiece
spec:
  selector: {app: grpc-transcoder}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-transcoder
  namespace: sapiece
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: grpc-transcoder}
  template:
    metadata:
      labels: {app: grpc-transcoder}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/stats/prometheus"
        prometheus.io/port: "9901"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: grpc-transcoder}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: envoy
          image: sapiece-grpc-transcoder:v5
          imagePullPolicy: Never
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9901}
          resources:
            requests: {cpu: 30m, memory: 32Mi}
            limits: {cpu: 300m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /ready, port: admin}
            failureThreshold: 30
            periodSeconds: 1
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 10
          volumeMounts:
            - {name: grpc-tls, mountPath: /etc/grpc-tls, readOnly: true}
      volumes:
        - name: grpc-tls
          secret:
            secretName: grpc-transcoder-client-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grpc-echo
  namespace: sapiece
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: grpc-echo}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grpc-transcoder
  namespace: sapiece
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: grpc-transcoder}
