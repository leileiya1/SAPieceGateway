admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}

static_resources:
  listeners:
    - name: http_json_listener
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http_grpc_transcoder
                request_timeout: 6s
                stream_idle_timeout: 15s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: grpc_routes
                  virtual_hosts:
                    - name: echo_service
                      domains: ["*"]
                      routes:
                        - match: {path: "/sapiece.demo.v1.EchoService/Echo"}
                          route:
                            cluster: grpc_echo
                            timeout: 2s
                            retry_policy:
                              retry_on: "connect-failure,reset,unavailable"
                              num_retries: 2
                              per_try_timeout: 1s
                        - match: {prefix: "/sapiece.demo.v1.EchoService/"}
                          route:
                            cluster: grpc_echo
                            timeout: 2s
                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/echo.pb
                      services: ["sapiece.demo.v1.EchoService"]
                      auto_mapping: true
                      convert_grpc_status: true
                      request_validation_options:
                        reject_unknown_method: true
                        reject_unknown_query_parameters: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_echo
      connect_timeout: 1s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 1s
      respect_dns_ttl: false
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: grpc-echo-headless.sapiece.svc.cluster.local
                      port_value: 9090
      health_checks:
        - timeout: 1s
          interval: 1s
          unhealthy_threshold: 1
          healthy_threshold: 1
          grpc_health_check:
            service_name: sapiece.demo.v1.EchoService
      outlier_detection:
        consecutive_5xx: 2
        interval: 2s
        base_ejection_time: 5s
        max_ejection_percent: 100
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: grpc-echo-headless.sapiece.svc.cluster.local
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              tls_maximum_protocol_version: TLSv1_3
            tls_certificates:
              - certificate_chain: {filename: /etc/grpc-tls/tls.crt}
                private_key: {filename: /etc/grpc-tls/tls.key}
            validation_context:
              trusted_ca: {filename: /etc/grpc-tls/ca.crt}
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: grpc-echo-headless.sapiece.svc.cluster.local
